name: ci

on:
  push:
    branches: [main, ci]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-image:
    runs-on: self-hosted
    steps:
      - name: Set current date as env variable
        run: echo "NOW=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
      - name: Fix for bad os check
        run: echo "RUNNER_OS=Linux" >> $GITHUB_ENV
      - name: Login to Forgejo Registry
        uses: https://cremin.dev/actions/podman-login@v1
        with:
          registry: cremin.dev
          username: ${{ github.actor }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
      - name: Check out repository
        uses: https://cremin.dev/actions/checkout@v4
      # Build the slim runtime image (this is what gets deployed). `layers: true`
      # keeps the local layer cache between runs on the self-hosted runner, so
      # unchanged steps (e.g. pnpm install) are reused. Building runtime also
      # builds the builder stage it copies from, priming the cache for the
      # builder image below.
      - name: Build runtime image
        uses: https://cremin.dev/actions/buildah-build@v2
        with:
          containerfiles: ./Containerfile
          context: ./
          oci: true
          layers: true
          extra-args: --target=runtime
          image: hostr
          tags: ${{ github.ref == 'refs/heads/main' && 'latest ' || '' }}${{ github.sha }}
      - name: Push runtime image
        uses: https://cremin.dev/actions/push-to-registry@v2
        with:
          registry: cremin.dev/jonathan
          username: ${{ github.actor }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
          image: hostr
          tags: ${{ github.ref == 'refs/heads/main' && 'latest ' || '' }}${{ github.sha }}
      # Build the builder stage for the test-image job (same runner). The runtime
      # build above already built this stage, so it's a cache hit. Kept in local
      # container storage only — never pushed.
      - name: Build test image
        uses: https://cremin.dev/actions/buildah-build@v2
        with:
          containerfiles: ./Containerfile
          context: ./
          oci: true
          layers: true
          extra-args: --target=builder
          image: hostr
          tags: ${{ github.sha }}-builder

  test-image:
    runs-on: self-hosted
    needs: build-image
    timeout-minutes: 15
    env:
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: https://cremin.dev/actions/checkout@v4

      # Re-running a job keeps the same run_id. If an earlier attempt died
      # mid-run (e.g. podman crashed), recreating a network with the same name
      # comes back with broken aardvark-dns resolution (EAI_AGAIN on `database`),
      # so give every attempt its own names and label them by run for cleanup.
      - name: Set per-attempt test id
        run: echo "TEST_ID=$RUN_ID-$(date +%s)" >> $GITHUB_ENV

      - name: Clean up any leftover containers and network from previous attempts
        run: |
          podman ps -aq --filter label=hostr-ci-run=$RUN_ID | xargs -r podman rm -f || true
          podman network ls -q --filter label=hostr-ci-run=$RUN_ID | xargs -r podman network rm -f || true

      - name: Create test network
        run: podman network create --label hostr-ci-run=$RUN_ID hostr-test-$TEST_ID

      - name: Start services
        run: |
          podman run -d --name database-$TEST_ID --network hostr-test-$TEST_ID \
            --label hostr-ci-run=$RUN_ID \
            --network-alias database \
            -e POSTGRES_PASSWORD=hostr \
            -e POSTGRES_USER=hostr \
            -e POSTGRES_DB=hostr \
            docker.io/library/postgres:18-alpine

          podman run -d --name redis-$TEST_ID --network hostr-test-$TEST_ID \
            --label hostr-ci-run=$RUN_ID \
            --network-alias redis \
            docker.io/library/redis:8-alpine

      # Check over TCP, not the unix socket: the postgres image's entrypoint
      # first runs a temporary socket-only server for initdb, and a socket
      # pg_isready passes during that phase and then fails once it stops.
      - name: Wait for postgres to be ready
        run: |
          for i in $(seq 1 30); do
            podman exec database-$TEST_ID pg_isready -h 127.0.0.1 -U hostr -d hostr && exit 0
            echo "Waiting for postgres... ($i/30)"
            sleep 2
          done
          echo "postgres did not become ready" >&2
          exit 1

      - name: Test image
        run: |
          podman run \
            --name hostr-test-app-$TEST_ID \
            --network hostr-test-$TEST_ID \
            --label hostr-ci-run=$RUN_ID \
            --env-file ./.forgejo/workflows/.env \
            --stop-timeout 10 \
            --pull never \
            localhost/hostr:${{ github.sha }}-builder \
            sh -c "mkdir -p /tmp/uploads && pnpm run init && pnpm test"

      - name: Cleanup
        if: ${{ always() }}
        run: |
          podman rm -f hostr-test-app-$TEST_ID database-$TEST_ID redis-$TEST_ID || true
          podman network rm hostr-test-$TEST_ID 2>/dev/null || true
          podman rmi localhost/hostr:${{ github.sha }}-builder 2>/dev/null || true
